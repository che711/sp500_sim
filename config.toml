# Настройки запуска. Запуск: sp500-sim run config.toml

[data]
ticker = "SPY"          # SPY - фонд на S&P 500; "^GSPC" - сам индекс (без дивидендов)
start = "2000-01-01"
# end = "2024-12-31"    # если не указано - до последнего доступного дня
cache_dir = "data"      # сюда сохраняются скачанные цены

[broker]
commission = 0.0005     # комиссия с каждой сделки (0.0005 = 0.05%)
slippage = 0.0005       # цена хуже на эту долю: покупка дороже, продажа дешевле
min_change = 0.01       # не торговать, если доля акций меняется меньше чем на 1%

[run]
cash = 10000            # стартовые деньги

[output]
dir = "results"         # здесь лежат база results.db и HTML-отчёты

# Стратегии. Каждая - отдельный блок [[strategies]].
# type выбирает стратегию, остальные поля - её параметры.

[[strategies]]
name = "Купить и держать"
type = "buy_and_hold"

[[strategies]]
name = "Тренд SMA-200"
type = "sma_trend"
n = 200                 # длина скользящей средней в днях
