<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}sp500-sim{% endblock %}</title>
<link rel="icon" href="{{ favicon }}">
<script>{{ head_js | safe }}</script>
<style>{{ theme_css | safe }}</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">{{ logo_svg | safe }}<span>sp500-sim</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'new' }}">Новый прогон</a>
      <a href="/runs" class="{{ 'active' if active == 'runs' }}">Прогоны</a>
      <a href="/compare" class="{{ 'active' if active == 'compare' }}">Сравнение</a>
      <a href="/api/docs">API</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Сменить тему"></button>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<script>{{ toggle_js | safe }}</script>
</body>
</html>
